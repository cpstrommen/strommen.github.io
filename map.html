<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Travel – Christian Strommen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive map of travel routes by Christian Strommen.">
  <meta name="keywords" content="Christian Strommen, travel map, aviation, driving, train routes">

  <link href="assets/favicon.png" rel="icon">
  <link href="assets/favicon.png" rel="shortcut icon">
  <link rel="shortcut icon" type="image/png" href="assets/favicon.png"/>

  <meta property="og:title" content="Travel Map – Christian Strommen">
  <meta property="og:description" content="Interactive map of flights, driving routes, and train routes.">
  <meta property="og:image" content="assets/favicon.png">
  <meta property="og:url" content="https://strommen.ch/map.html">

  <link href="styles/fonts.css" rel="stylesheet">
  <link href="styles/all.min.css" rel="stylesheet">
  <link href="styles/bootstrap-icons.css" rel="stylesheet">

  <link href="lib/animate/animate.min.css" rel="stylesheet">
  <link href="styles/bootstrap.min.css" rel="stylesheet">
  <link href="styles/style.css" rel="stylesheet">

  <link href="lib/leaflet/leaflet.css" rel="stylesheet">

  <style>
    #flight-map {
      width: 100%;
      height: min(76vh, 820px);
      min-height: 680px;
      border-radius: 0.75rem;
      overflow: hidden;
    }

    @media (max-width: 767.98px) {
      #flight-map {
        height: 72vh;
        min-height: 520px;
      }
    }

    .flight-map-legend {
      font-size: 0.9rem;
      opacity: 0.85;
    }

    .legend-swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .legend-swatch-pic {
      background-color: #00bcd4;
    }

    .legend-swatch-commercial {
      background-color: #ff9800;
    }

    .legend-swatch-driving {
      background-color: #4caf50;
    }

    .legend-swatch-train {
      background-color: #8e7cc3;
    }
  </style>
</head>

<body>
	  <div class="container py-5">
	    <div class="row gx-5 gy-3">
	      <div class="col-12">
	        <h1 class="title pb-2 mb-0">Travel</h1>
	      </div>

      <div class="col-12">
        <div id="flight-map" class="shadow"></div>
      </div>

      <div class="col-12 mt-3 flight-map-legend text-light">
        <span class="me-3">
          <span class="legend-swatch legend-swatch-pic"></span>
          General Aviation flights
        </span>
        <span class="me-3">
          <span class="legend-swatch legend-swatch-commercial"></span>
          Commercial flights
        </span>
        <span class="me-3">
          <span class="legend-swatch legend-swatch-driving"></span>
          Driving routes
        </span>
        <span>
          <span class="legend-swatch legend-swatch-train"></span>
          Train routes
        </span>
      </div>

	      <div class="col-12 mt-5">
	        <div class="text-light text-center">
	          <p class="m-0"><a href="index.html"><b>strommen.ch</b></a></p>
	        </div>
	      </div>
    </div>
  </div>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="lib/leaflet/leaflet.js"></script>

  <script src="js/travel-map.js"></script>
</body>
</html>
